name: Build static ffmpeg

# Builds the x64-windows-static package that StickerProcess links against
# (consumed as FFMPEG_DIR) and publishes it as a release asset.
# vcpkg is pinned by commit and its downloads/binary cache are restored between
# runs; the app side pins tag + sha256.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. ffmpeg-static-v2). Empty = build only."
        required: false
        default: ""
  push:
    branches: [master]
    paths:
      - "vcpkg.json"
      - "test/**"
      - ".github/workflows/build-static.yml"

permissions:
  contents: write

env:
  # The vcpkg tree is the version pin: it decides the ffmpeg port (9.0.1) and
  # libvpx port (1.16.0) this package is built from. Bump deliberately and
  # re-publish under a new tag.
  VCPKG_PIN: 386d7c478221b7ee0c97bfe6ea61dcf65121d564
  VCPKG_TRIPLET: x64-windows-static

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      # The image has ~14 GB free with VS/MSYS2 already installed; ffmpeg's
      # buildtrees need room next to that.
      - name: Reclaim disk space
        shell: pwsh
        run: |
          $paths = @(
            "C:\Android", "C:\Program Files\Android", "C:\Program Files\dotnet",
            "C:\ghc", "C:\tools\nginx-1.31.5", "C:\tools\Apache24"
          )
          foreach ($p in $paths) {
            if (Test-Path $p) { Remove-Item -Recurse -Force $p -ErrorAction SilentlyContinue }
          }
          Get-PSDrive C | Format-Table Used, Free

      - name: Install the pinned vcpkg
        shell: pwsh
        run: |
          curl.exe -fsSL -o vcpkg.tar.gz "https://github.com/microsoft/vcpkg/archive/$env:VCPKG_PIN.tar.gz"
          tar -xzf vcpkg.tar.gz
          Move-Item "vcpkg-$env:VCPKG_PIN" vcpkg-src
          "VCPKG_ROOT=$env:GITHUB_WORKSPACE\vcpkg-src" >> $env:GITHUB_ENV
          "VCPKG_DEFAULT_BINARY_CACHE=$env:GITHUB_WORKSPACE\vcpkg-cache" >> $env:GITHUB_ENV
          "VCPKG_DISABLE_METRICS=1" >> $env:GITHUB_ENV
          & "$env:GITHUB_WORKSPACE\vcpkg-src\bootstrap-vcpkg.bat" -disableMetrics

      # Downloads (source tarballs) and the files binary cache: a rerun that only
      # changes ffmpeg's own inputs still avoids re-downloading, and ports that
      # did not change come from the binary cache. buildtrees are deliberately
      # not cached (GBs, invalid across ABI changes).
      - name: Cache vcpkg downloads and binaries
        uses: actions/cache@v4
        with:
          path: |
            vcpkg-src/downloads
            vcpkg-cache
          key: vcpkg-${{ env.VCPKG_TRIPLET }}-${{ env.VCPKG_PIN }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ env.VCPKG_TRIPLET }}-${{ env.VCPKG_PIN }}-

      # Manifest mode resolves ffmpeg[vpx,zlib] and libvpx[highbitdepth] in one
      # graph, which is what makes the 10-bit VP9 encoder work (the classic-mode
      # recipe needed `vcpkg install libvpx[highbitdepth] --recurse`).
      - name: Install ffmpeg + libvpx[highbitdepth]
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet $env:VCPKG_TRIPLET --clean-after-build

      - name: Assert the package shape and versions
        shell: pwsh
        run: |
          $root = "$env:GITHUB_WORKSPACE\vcpkg_installed\$env:VCPKG_TRIPLET"
          $required = @(
            "lib\avcodec.lib", "lib\avdevice.lib", "lib\avfilter.lib", "lib\avformat.lib",
            "lib\avutil.lib", "lib\swresample.lib", "lib\swscale.lib", "lib\vpx.lib", "lib\zs.lib",
            "include\libavcodec\avcodec.h", "include\libavutil\ffversion.h"
          )
          foreach ($f in $required) {
            if (!(Test-Path "$root\$f")) { throw "package is missing $f" }
          }
          $ver = (Select-String -Path "$root\include\libavutil\ffversion.h" -Pattern 'FFMPEG_VERSION "(.+)"').Matches[0].Groups[1].Value
          $zver = (Select-String -Path "$root\include\zlib.h" -Pattern '#define ZLIB_VERSION "(.+)"').Matches[0].Groups[1].Value
          Write-Host "ffmpeg=$ver zlib=$zver vcpkg_pin=$env:VCPKG_PIN"
          "ffmpeg=$ver, zlib=$zver, libvpx=1.16.0, vcpkg=$env:VCPKG_PIN, triplet=$env:VCPKG_TRIPLET" |
            Set-Content -Path versions.txt -Encoding ASCII
          if ($ver -notmatch '^9\.') { throw "unexpected ffmpeg version '$ver' for the pinned vcpkg tree" }

      # The gate that matters: 10-bit VP9 (the highbitdepth feature) plus a
      # complete static link set, with no ffmpeg DLL left in the import table.
      - name: Static smoke test
        shell: pwsh
        run: ./test/run-smoke.ps1 -Root "$env:GITHUB_WORKSPACE\vcpkg_installed\$env:VCPKG_TRIPLET"

      # Same shape as v1: lib/ include/ share/ from the triplet root, which is
      # what build.rs + ffmpeg-sys-the-third consume.
      - name: Package
        shell: bash
        run: |
          root="vcpkg_installed/${VCPKG_TRIPLET}"
          tar -cJf ffmpeg-static-x64-win.tar.xz -C "$root" lib include share
          sha256sum ffmpeg-static-x64-win.tar.xz | tee SHA256SUMS.txt
          ls -l ffmpeg-static-x64-win.tar.xz

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-static-x64-win
          path: |
            ffmpeg-static-x64-win.tar.xz
            SHA256SUMS.txt

      - name: Publish release
        if: inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          NOTES=$(printf '%s\n' \
            "vcpkg x64-windows-static package of ffmpeg for StickerProcess (desktop, static link)." \
            "" \
            "- vcpkg tree: https://github.com/microsoft/vcpkg @ ${VCPKG_PIN}" \
            "- resolved: $(cat versions.txt)" \
            "- features: avcodec avdevice avfilter avformat swresample swscale vpx zlib" \
            "- smoke tested: libvpx-vp9 yuv420p10le encode + webm muxer + no ffmpeg DLL imports" \
            "- unpack: \`tar xJf ffmpeg-static-x64-win.tar.xz -C <dir>\`, then set \`FFMPEG_DIR=<dir>\`" \
            "" \
            "\`\`\`" \
            "$(cat SHA256SUMS.txt)" \
            "\`\`\`" \
            "" \
            "Components: FFmpeg LGPLv2.1+, libvpx BSD-3-Clause, zlib license." \
            "Source for this binary: the pinned vcpkg tree above plus its port sources.")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ffmpeg-static-x64-win.tar.xz SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" --title "ffmpeg static x64-windows-static $TAG" --notes "$NOTES" \
              ffmpeg-static-x64-win.tar.xz SHA256SUMS.txt
          fi
          gh release edit "$TAG" --notes "$NOTES"

  # Publishes first, then builds the actual consumer against the published
  # asset: this is the only check that catches a dependency change breaking the
  # app's hard-coded static link list in src/build.rs. The app side switches its
  # pin only after this passes.
  verify-app:
    needs: build
    if: inputs.tag != ''
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Fetch the published package
        shell: bash
        run: |
          mkdir -p ffmpeg-dist
          curl -sSL --retry 3 -o ff.tar.xz \
            "https://github.com/TheFunny/ffmpeg-static-win/releases/download/${{ inputs.tag }}/ffmpeg-static-x64-win.tar.xz"
          tar xJf ff.tar.xz -C ffmpeg-dist
          test -f ffmpeg-dist/lib/avcodec.lib

      - uses: actions/checkout@v4
        with:
          repository: TheFunny/StickerProcess
          path: app

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/target
          key: verify-app-${{ runner.os }}-${{ hashFiles('app/Cargo.lock') }}
          restore-keys: verify-app-${{ runner.os }}-

      - name: cargo build --release against the published package
        shell: bash
        working-directory: app
        env:
          FFMPEG_DIR: ${{ github.workspace }}/ffmpeg-dist
        run: cargo build --release
